<!DOCTYPE html>
<html lang="en">
<head>
    <!-- set character encoding and viewport for responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- page title -->
    <title>Food Recipe Tracker</title>
    <!-- link to Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- link to custom stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- main container with some margin on top -->
    <div class="container mt-5">
        <h1 class="text-center">Food Recipe Tracker</h1>
       <!-- Search, Filter, and Sort Section -->
        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" id="searchBar" class="form-control" placeholder="Search Recipes...">
            </div>
            <div class="col-md-4">
                <select id="categoryFilter" class="form-select">
                    <option value="">All Categories</option>
                    <!-- Predefined categories in the dropdown -->
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Vegan">Vegan</option>
                    <option value="Low-Carb">Low-Carb</option>
                </select>
            </div>
            <div class="col-md-4 text-end">
                <select id="sortCriteria" class="form-select">
                    <option value="time">Sort by Cooking Time</option>
                    <option value="alphabetical">Sort Alphabetically</option>
                    <option value="dateAdded">Sort by Date Added</option>
                </select>
            </div>
        </div>
        <!-- Dashboard -->
        <div class="dashboard">
            <h2>Recipe Dashboard</h2>
            <div class="row">
                <!-- Total Recipes -->
                <div class="col-md-3">
                    <div class="card text-white bg-primary">
                        <div class="card-body">
                            <h5 class="card-title">Total Recipes</h5>
                            <p class="card-text" id="totalRecipes">0</p>
                        </div>
                    </div>
                </div>

                <!-- Favorited Recipes -->
                <div class="col-md-3">
                    <div class="card text-white bg-info">
                        <div class="card-body">
                            <h5 class="card-title">Favorited Recipes</h5>
                            <p class="card-text" id="favoritedRecipes">0</p>
                        </div>
                    </div>
                </div>

                <!-- Recently Added Recipes -->
                <div class="col-md-3">
                    <div class="card text-white bg-warning">
                        <div class="card-body">
                            <h5 class="card-title">Recently Added Recipes</h5>
                            <ul class="list-group" id="recentRecipes"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!-- recipe form -->
        <div class="card mt-4 p-4">
            <button id="toggleFormBtn">Add Recipe</button>
            <form id="recipeForm" style="display: none;">
                <!-- input field for recipe name -->
                <div class="mb-3">
                    <label for="recipeName" class="form-label">Recipe Name</label>
                    <input type="text" id="recipeName" class="form-control">
                </div>
                <!-- input field for ingredients -->
                <div class="mb-3">
                    <label for="recipeIngredients" class="form-label">Ingredients</label>
                    <textarea id="recipeIngredients" class="form-control" rows="3"></textarea>
                </div>
                <!-- input field for recipe steps -->
                <div class="mb-3">
                    <label for="recipeSteps" class="form-label">Steps</label>
                    <textarea id="recipeSteps" class="form-control" rows="3"></textarea>
                </div>
                <!-- dropdown for recipe category -->
                <div class="mb-3">
                    <label for="recipeCategory" class="form-label">Category</label>
                    <select id="recipeCategory" class="form-select" >
                    <!-- categories can be added here -->
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Vegan">Vegan</option>
                        <option value="Low-Carb">Low-Carb</option>
                    </select>
                </div>              
                <!-- input field for preparation time in minutes -->
                <div class="mb-3">
                    <label for="recipeTime" class="form-label">Time (in minutes)</label>
                    <input type="number" id="recipeTime" class="form-control">
                </div>
                <!-- input field for recipe image -->
                <div class="mb-3">
                    <label for="recipeImage" class="form-label">Recipe Image</label>
                    <input type="file" id="recipeImage" class="form-control">
                </div>
                <!-- submit button for saving the recipe -->
                <button type="submit" class="btn btn-primary">Save Recipe</button>
            </form>
        </div>
        <!-- all recipes -->
        <h2>All Recipes</h2>
        <div class="row" id="recipeList"></div>

        <!-- favorites section -->
        <h2>Favorites</h2>
        <div class="row" id="favoritesList"></div>
    </div>

    <!-- modal for recipe details -->
    <div class="modal fade" id="recipeModal" tabindex="-1" aria-labelledby="recipeModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- modal header with title and close button -->
                <div class="modal-header">
                    <h5 class="modal-title" id="recipeModalLabel">Recipe Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!-- modal body to display recipe details -->
                <div class="modal-body">
                    <p><strong>Recipe Name:</strong> <span id="modalRecipeName"></span></p>
                    <p><strong>Ingredients:</strong> <span id="modalRecipeIngredients"></span></p>
                    <p><strong>Steps:</strong> <span id="modalRecipeSteps"></span></p>
                    <p><strong>Category:</strong> <span id="modalRecipeCategory"></span></p>
                    <p><strong>Time:</strong> <span id="modalRecipeTime"></span></p>
                </div>
                <!-- modal footer with close button -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS, jQuery, and Javascript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
